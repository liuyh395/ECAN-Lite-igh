<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EtherCAT SM mode cyclic CAN FD gateway data path</title>
  <desc id="desc">The IgH application exchanges process data with the ESC on a fixed application period. The firmware consumes RxPDO, sends CAN FD, receives motor feedback and publishes TxPDO for a later application cycle.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/><stop offset="1" stop-color="#ECF3F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#17324D" flood-opacity="0.11"/>
    </filter>
    <marker id="blueArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0V8L11 4z" fill="#2A6FDB"/></marker>
    <marker id="greenArrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto"><path d="M0 0V8L11 4z" fill="#27865B"/></marker>
    <style>
      text{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif;fill:#17324D}
      .title{font-size:40px;font-weight:700}.subtitle{font-size:19px;fill:#587087}
      .head{font-size:24px;font-weight:700}.label{font-size:18px;font-weight:700}
      .small{font-size:16px;fill:#587087}.tiny{font-size:14px;fill:#587087}.on-dark{fill:#D8E7F2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="75" class="title">EtherCAT SM 模式 · 周期数据交换链路</text>
  <text x="80" y="112" class="subtitle">周期由 IgH 应用时钟驱动；从站收到 RxPDO 后立即处理，不依赖 DC SYNC0</text>

  <g filter="url(#shadow)">
    <rect x="70" y="165" width="390" height="525" rx="22" fill="#FFFFFF"/>
    <rect x="605" y="165" width="390" height="525" rx="22" fill="#FFFFFF"/>
    <rect x="1140" y="165" width="390" height="525" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="265" cy="225" r="33" fill="#DCEBFF"/><text x="265" y="234" text-anchor="middle" class="head">1</text>
  <text x="265" y="292" text-anchor="middle" class="head">IgH 主站应用</text>
  <rect x="120" y="335" width="290" height="86" rx="14" fill="#EFF6FF" stroke="#2A6FDB" stroke-width="2"/>
  <text x="265" y="370" text-anchor="middle" class="label">cycle_begin()</text>
  <text x="265" y="397" text-anchor="middle" class="small">收 TxPDO · 解析电机反馈</text>
  <rect x="120" y="455" width="290" height="86" rx="14" fill="#EFF6FF" stroke="#2A6FDB" stroke-width="2"/>
  <text x="265" y="490" text-anchor="middle" class="label">控制计算</text>
  <text x="265" y="517" text-anchor="middle" class="small">只更新本时隙活动通道</text>
  <rect x="120" y="575" width="290" height="76" rx="14" fill="#EFF6FF" stroke="#2A6FDB" stroke-width="2"/>
  <text x="265" y="607" text-anchor="middle" class="label">cycle_end()</text>
  <text x="265" y="634" text-anchor="middle" class="small">发送本周期 RxPDO</text>

  <circle cx="800" cy="225" r="33" fill="#E5F4EC"/><text x="800" y="234" text-anchor="middle" class="head">2</text>
  <text x="800" y="292" text-anchor="middle" class="head">ECAN 网关固件</text>
  <rect x="655" y="335" width="290" height="86" rx="14" fill="#F0FAF5" stroke="#27865B" stroke-width="2"/>
  <text x="800" y="370" text-anchor="middle" class="label">ESC SM / PDI 事件</text>
  <text x="800" y="397" text-anchor="middle" class="small">读取 RxPDO · 校验并解包</text>
  <rect x="655" y="455" width="290" height="86" rx="14" fill="#F0FAF5" stroke="#27865B" stroke-width="2"/>
  <text x="800" y="490" text-anchor="middle" class="label">MCAN 收发服务</text>
  <text x="800" y="517" text-anchor="middle" class="small">TX FIFO 投递 · RX FIFO 排空</text>
  <rect x="655" y="575" width="290" height="76" rx="14" fill="#F0FAF5" stroke="#27865B" stroke-width="2"/>
  <text x="800" y="607" text-anchor="middle" class="label">发布 TxPDO</text>
  <text x="800" y="634" text-anchor="middle" class="small">反馈进入后续主站周期</text>

  <circle cx="1335" cy="225" r="33" fill="#FFF0D6"/><text x="1335" y="234" text-anchor="middle" class="head">3</text>
  <text x="1335" y="292" text-anchor="middle" class="head">CAN FD 电机</text>
  <rect x="1190" y="365" width="290" height="96" rx="14" fill="#FFF8EB" stroke="#D18417" stroke-width="2"/>
  <text x="1335" y="404" text-anchor="middle" class="label">接收控制帧</text>
  <text x="1335" y="433" text-anchor="middle" class="small">执行电流 / 位置控制</text>
  <rect x="1190" y="525" width="290" height="96" rx="14" fill="#FFF8EB" stroke="#D18417" stroke-width="2"/>
  <text x="1335" y="564" text-anchor="middle" class="label">返回状态帧</text>
  <text x="1335" y="593" text-anchor="middle" class="small">位置 · 速度 · 力矩 · 状态</text>

  <path d="M655 385H430" stroke="#2A6FDB" stroke-width="5" marker-end="url(#blueArrow)"/>
  <text x="543" y="367" text-anchor="middle" class="small">EtherCAT TxPDO</text>
  <path d="M945 420H1170" stroke="#27865B" stroke-width="5" marker-end="url(#greenArrow)"/>
  <text x="1058" y="400" text-anchor="middle" class="small">CAN FD command</text>
  <path d="M1190 575H965" stroke="#27865B" stroke-width="5" marker-end="url(#greenArrow)"/>
  <text x="1078" y="613" text-anchor="middle" class="small">CAN FD feedback</text>
  <path d="M410 615H635" stroke="#2A6FDB" stroke-width="5" marker-end="url(#blueArrow)"/>
  <text x="523" y="653" text-anchor="middle" class="small">EtherCAT RxPDO</text>

  <rect x="70" y="735" width="1460" height="100" rx="18" fill="#17324D"/>
  <text x="105" y="778" fill="#FFFFFF" class="label">关键口径</text>
  <text x="105" y="811" class="small on-dark">SM 只保证周期交换，不提供 SYNC0 硬件相位；“MCAN0/1/2/3 固定相位”由主站绝对 250 μs 软件时隙实现。</text>
</svg>
