<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SM 250 microsecond four-phase pipeline for a 1 millisecond control loop</title>
  <desc id="desc">Four EtherCAT subcycles serve MCAN0 through MCAN3 in sequence. Each MCAN channel repeats every millisecond. Feedback received within four subcycles is used for the next command.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FAFC"/>
      <stop offset="1" stop-color="#EEF4F8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18324A" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#2A6FDB"/>
    </marker>
    <style>
      text { font-family: "Noto Sans SC", "Microsoft YaHei", Arial, sans-serif; fill: #17324D; }
      .title { font-size: 38px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #587087; }
      .axis { font-size: 17px; font-weight: 700; }
      .label { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; fill: #587087; }
      .tiny { font-size: 13px; fill: #587087; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="80" y="72" class="title">SM 250 μs 四相流水线 · 每通道 1 ms 闭环</text>
  <text x="80" y="108" class="subtitle">三从站推荐：RxPDO 128 B + TxPDO 256 B / 从站 · 单 EtherCAT 帧 · 固定通道相位</text>

  <g filter="url(#shadow)">
    <rect x="70" y="145" width="1460" height="230" rx="18" fill="#FFFFFF"/>
  </g>
  <text x="100" y="185" class="axis">EtherCAT SM 子周期</text>
  <line x1="220" y1="245" x2="1450" y2="245" stroke="#8EA6BA" stroke-width="2"/>
  <g>
    <rect x="220" y="205" width="300" height="80" rx="10" fill="#DCEBFF" stroke="#2A6FDB" stroke-width="2"/>
    <rect x="520" y="205" width="300" height="80" rx="10" fill="#E5F4EC" stroke="#27865B" stroke-width="2"/>
    <rect x="820" y="205" width="300" height="80" rx="10" fill="#FFF0D6" stroke="#D18417" stroke-width="2"/>
    <rect x="1120" y="205" width="300" height="80" rx="10" fill="#F0E8FF" stroke="#7750B6" stroke-width="2"/>
    <text x="370" y="238" text-anchor="middle" class="label">相位 0 · MCAN0</text>
    <text x="670" y="238" text-anchor="middle" class="label">相位 1 · MCAN1</text>
    <text x="970" y="238" text-anchor="middle" class="label">相位 2 · MCAN2</text>
    <text x="1270" y="238" text-anchor="middle" class="label">相位 3 · MCAN3</text>
    <text x="370" y="266" text-anchor="middle" class="small">读反馈 → 计算 → 发命令</text>
    <text x="670" y="266" text-anchor="middle" class="small">读反馈 → 计算 → 发命令</text>
    <text x="970" y="266" text-anchor="middle" class="small">读反馈 → 计算 → 发命令</text>
    <text x="1270" y="266" text-anchor="middle" class="small">读反馈 → 计算 → 发命令</text>
  </g>
  <g class="small" text-anchor="middle">
    <text x="220" y="320">0 μs</text><text x="520" y="320">250 μs</text>
    <text x="820" y="320">500 μs</text><text x="1120" y="320">750 μs</text>
    <text x="1420" y="320">1000 μs</text>
  </g>
  <path d="M220 345 H1420" stroke="#2A6FDB" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="820" y="365" text-anchor="middle" class="small">四个250 μs子周期 = 一个1 ms控制帧</text>

  <g filter="url(#shadow)">
    <rect x="70" y="405" width="1460" height="360" rx="18" fill="#FFFFFF"/>
  </g>
  <text x="100" y="445" class="axis">单通道闭环时间线（以MCAN0为例）</text>
  <line x1="220" y1="550" x2="1450" y2="550" stroke="#9BAFC1" stroke-width="2"/>
  <g stroke="#D5DFE7" stroke-width="1">
    <line x1="220" y1="485" x2="220" y2="700"/><line x1="520" y1="485" x2="520" y2="700"/>
    <line x1="820" y1="485" x2="820" y2="700"/><line x1="1120" y1="485" x2="1120" y2="700"/>
    <line x1="1420" y1="485" x2="1420" y2="700"/>
  </g>
  <circle cx="220" cy="550" r="11" fill="#2A6FDB"/>
  <text x="220" y="510" text-anchor="middle" class="label">N：提交命令</text>
  <text x="220" y="590" text-anchor="middle" class="small">RxPDO在cycle_end发出</text>

  <rect x="325" y="610" width="560" height="50" rx="25" fill="#E5F4EC" stroke="#27865B" stroke-width="2"/>
  <text x="605" y="641" text-anchor="middle" class="label">网关处理 + CAN FD发送 + 电机应答</text>

  <circle cx="1120" cy="550" r="11" fill="#27865B"/>
  <text x="1120" y="510" text-anchor="middle" class="label">理想 N+3</text>
  <text x="1120" y="590" text-anchor="middle" class="small">若约750 μs读到反馈</text>
  <path d="M1135 550 H1395" stroke="#27865B" stroke-width="8" stroke-linecap="round"/>
  <text x="1265" y="530" text-anchor="middle" class="small">控制计算余量</text>

  <circle cx="1420" cy="550" r="13" fill="#D18417"/>
  <text x="1420" y="510" text-anchor="middle" class="label">N+4：1 ms硬截止线</text>
  <text x="1420" y="590" text-anchor="middle" class="small">先收反馈，仍可在本槽发下一命令</text>

  <path d="M220 695 H1420" stroke="#2A6FDB" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="820" y="728" text-anchor="middle" class="label">同一通道：MCAN0(N) → MCAN0(N+4) = 1 ms</text>

  <g transform="translate(70 795)">
    <rect width="450" height="70" rx="14" fill="#E9F3FF"/>
    <text x="24" y="29" class="label">固定相位，均摊四通道负载</text>
    <text x="24" y="53" class="small">避免四路命令集中抢占同一子周期</text>
    <rect x="500" width="450" height="70" rx="14" fill="#E9F7F0"/>
    <text x="524" y="29" class="label">反馈≤4个子周期：满足1 ms</text>
    <text x="524" y="53" class="small">N+3有余量，N+4刚好赶上下一槽</text>
    <rect x="1000" width="460" height="70" rx="14" fill="#FFF1E3"/>
    <text x="1024" y="29" class="label">反馈&gt;4个子周期：闭环降级</text>
    <text x="1024" y="53" class="small">demo记录blocked_slot并返回失败</text>
  </g>
</svg>
